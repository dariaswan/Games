<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Не пусти Санька в чат</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1d23;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #e0e0e0;
    overflow: hidden;
  }
  #game {
    position: relative;
    width: 900px;
    height: 600px;
    background: #0f1115;
    border: 2px solid #2a2f3a;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  /* Окно чата */
  #chat {
    position: absolute;
    right: 40px;
    top: 90px;
    width: 300px;
    height: 420px;
    background: #1e222a;
    border: 2px solid #3a4150;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    z-index: 5;
  }
  #chat-header {
    background: #2a3140;
    padding: 10px 14px;
    font-weight: bold;
    font-size: 15px;
    border-bottom: 1px solid #3a4150;
    border-radius: 8px 8px 0 0;
    color: #8ab4f8;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #chat-header .status { font-size: 12px; color: #5f6b7d; font-weight: normal; }
  #chat-messages {
    flex: 1;
    padding: 10px;
    overflow: hidden;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg { padding: 6px 10px; border-radius: 8px; max-width: 85%; line-height: 1.3; }
  .msg.bot { background: #232833; color: #9aa7b8; align-self: flex-start; }
  .msg.me { background: #2d4a7a; color: #d0e2ff; align-self: flex-end; }
  #chat-input {
    padding: 8px 12px;
    border-top: 1px solid #3a4150;
    color: #5f6b7d;
    font-size: 13px;
    background: #181c23;
    border-radius: 0 0 8px 8px;
  }
  /* HUD */
  #hud {
    position: absolute;
    top: 16px;
    left: 20px;
    display: flex;
    gap: 24px;
    font-size: 14px;
    z-index: 10;
  }
  #hud .stat { background: #1e222a; padding: 8px 16px; border-radius: 8px; border: 1px solid #2a2f3a; }
  #hud .stat span { color: #f0b429; font-weight: bold; }
  #hud .stat.lives span { color: #f04a4a; }
  #hud .stat.score span { color: #4af07a; }

  /* Санёк */
  .sanya {
    position: absolute;
    width: 70px;
    height: 90px;
    z-index: 8;
    cursor: pointer;
    transition: transform 0.05s;
    user-select: none;
    filter: drop-shadow(0 0 6px rgba(240,74,74,0.5));
  }
  .sanya:active { transform: scale(0.92); }
  .sanya canvas { width: 100%; height: 100%; }

  /* Всплывашки */
  .float-text {
    position: absolute;
    font-weight: bold;
    font-size: 18px;
    pointer-events: none;
    z-index: 20;
    animation: floatUp 0.8s ease-out forwards;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
  }

  /* Оверлей */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,12,16,0.88);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 50;
    gap: 18px;
    text-align: center;
    padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay h1 { font-size: 34px; margin-bottom: 4px; }
  #overlay p { font-size: 16px; color: #9aa7b8; max-width: 480px; line-height: 1.5; }
  #overlay button {
    margin-top: 10px;
    padding: 12px 32px;
    font-size: 17px;
    font-weight: bold;
    background: #2d4a7a;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #overlay button:hover { background: #3a5f9a; }
  #win-title { color: #4af07a; }
  #lose-title { color: #f04a4a; }
  .hint { font-size: 13px; color: #5f6b7d; }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div class="stat lives">Жизни: <span id="lives">3</span></div>
    <div class="stat score">Очки: <span id="score">0</span></div>
    <div class="stat">Волна: <span id="wave">1</span></div>
  </div>

  <div id="chat">
    <div id="chat-header">
      <span>💬 Лучше чем Lebro 2.0</span>
      <span class="status" id="chat-status">● онлайн</span>
    </div>
    <div id="chat-messages">
      <div class="msg bot">Привет, чат!</div>
      <div class="msg me">Тут спокойно, Санька не пускаем 😎</div>
      <div class="msg bot">Кто это там скребётся?</div>
    </div>
    <div id="chat-input">Написать сообщение...</div>
  </div>

  <div id="overlay">
    <h1 id="overlay-title"></h1>
    <p id="overlay-text"></p>
    <button id="overlay-btn">Играть</button>
    <div class="hint">Кликай по Саньку, чтобы отбивать его от чата</div>
  </div>
</div>

<script>
(function() {
  const game = document.getElementById('game');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const overlayBtn = document.getElementById('overlay-btn');
  const livesEl = document.getElementById('lives');
  const scoreEl = document.getElementById('score');
  const waveEl = document.getElementById('wave');
  const chatStatus = document.getElementById('chat-status');
  const chatMessages = document.getElementById('chat-messages');

  const GAME_W = 900, GAME_H = 600;
  const CHAT_ZONE = { x: 640, y: 90, w: 300, h: 420 }; // правая граница чата
  const CHAT_ENTRY_X = CHAT_ZONE.x; // если Санёк дошёл до этой X — он в чате

  let lives = 3;
  let score = 0;
  let wave = 1;
  let sanyas = [];
  let running = false;
  let lastTime = 0;
  let spawnTimer = 0;
  let spawnInterval = 1800; // мс
  let gameTime = 0;

  const chatTaunts = [
    'Санёк: пустите меня в чат!',
    'Санёк: я же лысый и голубоглазый!',
    'Санёк: ну пожалуйста!',
    'Санёк: я только почитать!',
    'Санёк: Лучше чем Lebro 2.0 — мой чат!',
    'Санёк: откройте окно!',
  ];

  // ---- Рисование Санька на canvas ----
  function drawSanya(ctx) {
    ctx.clearRect(0, 0, 70, 90);
    // Тело (футболка)
    ctx.fillStyle = '#3a5f9a';
    ctx.beginPath();
    ctx.roundRect(10, 45, 50, 45, 8);
    ctx.fill();
    // Голова (лысая)
    ctx.fillStyle = '#e8b88a';
    ctx.beginPath();
    ctx.arc(35, 28, 22, 0, Math.PI * 2);
    ctx.fill();
    // Блик на лысине
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(28, 16, 8, 5, -0.5, 0, Math.PI * 2);
    ctx.fill();
    // Глаза (голубые)
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(26, 28, 5.5, 0, Math.PI * 2);
    ctx.arc(44, 28, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a9eff';
    ctx.beginPath();
    ctx.arc(27, 29, 3, 0, Math.PI * 2);
    ctx.arc(45, 29, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(27, 29, 1.4, 0, Math.PI * 2);
    ctx.arc(45, 29, 1.4, 0, Math.PI * 2);
    ctx.fill();
    // Брови (решительные)
    ctx.strokeStyle = '#8a6a4a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(20, 20); ctx.lineTo(30, 22);
    ctx.moveTo(50, 20); ctx.lineTo(40, 22);
    ctx.stroke();
    // Рот (ухмылка)
    ctx.strokeStyle = '#8a4a3a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(35, 38, 7, 0.15, Math.PI - 0.15);
    ctx.stroke();
    // Уши
    ctx.fillStyle = '#e8b88a';
    ctx.beginPath();
    ctx.arc(13, 30, 5, 0, Math.PI * 2);
    ctx.arc(57, 30, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  function createSanya() {
    const el = document.createElement('div');
    el.className = 'sanya';
    const canvas = document.createElement('canvas');
    canvas.width = 70;
    canvas.height = 90;
    drawSanya(canvas.getContext('2d'));
    el.appendChild(canvas);

    // Начальная позиция — слева, случайная Y
    const startX = -80;
    const startY = 120 + Math.random() * (GAME_H - 240);

    const speedBase = 28 + wave * 6; // px/сек
    const obj = {
      el,
      x: startX,
      y: startY,
      speed: speedBase * (0.8 + Math.random() * 0.5),
      bobPhase: Math.random() * Math.PI * 2,
      alive: true,
      hp: 1,
    };

    el.style.left = obj.x + 'px';
    el.style.top = obj.y + 'px';

    el.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      hitSanya(obj);
    });

    game.appendChild(el);
    sanyas.push(obj);
  }

  function hitSanya(obj) {
    if (!obj.alive || !running) return;
    obj.alive = false;
    score += 10;
    scoreEl.textContent = score;
    spawnFloatText(obj.x + 35, obj.y, '+10', '#4af07a');
    obj.el.remove();
    // Убираем из массива
    const idx = sanyas.indexOf(obj);
    if (idx > -1) sanyas.splice(idx, 1);
    // Звук? Нет, просто визуал
  }

  function spawnFloatText(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    game.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  function addChatMessage(text, isBot) {
    const el = document.createElement('div');
    el.className = 'msg ' + (isBot ? 'bot' : 'me');
    el.textContent = text;
    chatMessages.appendChild(el);
    // Ограничиваем количество
    while (chatMessages.children.length > 8) {
      chatMessages.removeChild(chatMessages.firstChild);
    }
  }

  // ---- Игровой цикл ----
  function update(dt) {
    gameTime += dt;

    // Спавн
    spawnTimer -= dt * 1000;
    if (spawnTimer <= 0) {
      createSanya();
      spawnTimer = spawnInterval * (0.7 + Math.random() * 0.6);
    }

    // Движение Саньков
    for (let i = sanyas.length - 1; i >= 0; i--) {
      const s = sanyas[i];
      if (!s.alive) continue;
      s.x += s.speed * dt;
      // Лёгкое покачивание
      s.bobPhase += dt * 6;
      const bobY = Math.sin(s.bobPhase) * 4;

      s.el.style.left = s.x + 'px';
      s.el.style.top = (s.y + bobY) + 'px';

      // Дошёл до чата?
      if (s.x + 60 >= CHAT_ENTRY_X) {
        s.alive = false;
        s.el.remove();
        sanyas.splice(i, 1);
        lives--;
        livesEl.textContent = lives;
        spawnFloatText(CHAT_ENTRY_X - 40, s.y, '-1 ❤', '#f04a4a');
        addChatMessage(chatTaunts[Math.floor(Math.random() * chatTaunts.length)], true);
        chatStatus.textContent = '● Санёк в чате!';
        chatStatus.style.color = '#f04a4a';
        setTimeout(() => {
          if (running) {
            chatStatus.textContent = '● онлайн';
            chatStatus.style.color = '';
          }
        }, 1200);
        if (lives <= 0) {
          endGame(false);
          return;
        }
      }
    }

    // Волны: каждые 20 секунд
    const newWave = 1 + Math.floor(gameTime / 20);
    if (newWave !== wave) {
      wave = newWave;
      waveEl.textContent = wave;
      spawnInterval = Math.max(600, 1800 - wave * 120);
      addChatMessage('Волна ' + wave + '! Саньки озверели!', true);
    }
  }

  function loop(timestamp) {
    if (!running) return;
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.1) dt = 0.1; // защита от лагов
    update(dt);
    requestAnimationFrame(loop);
  }

  // ---- Управление игрой ----
  function startGame() {
    // Очистка
    sanyas.forEach(s => s.el.remove());
    sanyas = [];
    lives = 3;
    score = 0;
    wave = 1;
    gameTime = 0;
    spawnTimer = 800;
    spawnInterval = 1800;
    lastTime = 0;
    running = true;

    livesEl.textContent = lives;
    scoreEl.textContent = score;
    waveEl.textContent = wave;
    chatStatus.textContent = '● онлайн';
    chatStatus.style.color = '';

    // Сброс сообщений
    chatMessages.innerHTML = '';
    addChatMessage('Привет, чат!', true);
    addChatMessage('Тут спокойно, Санька не пускаем 😎', false);
    addChatMessage('Кто это там скребётся?', true);

    overlay.classList.remove('show');
    requestAnimationFrame(loop);
  }

  function endGame(win) {
    running = false;
    // Удаляем всех Саньков
    sanyas.forEach(s => s.el.remove());
    sanyas = [];

    overlayTitle.textContent = win ? 'Победа!' : 'Санёк пробрался в чат!';
    overlayTitle.id = win ? 'win-title' : 'lose-title';
    overlayText.textContent = win
      ? 'Ты отбил все атаки. Очки: ' + score
      : 'Санёк добрался до чата и написал: «Я Лучше чем Lebro 2.0». Очки: ' + score;
    overlayBtn.textContent = 'Ещё раз';
    overlay.classList.add('show');
  }

  overlayBtn.addEventListener('click', startGame);

  // Показ стартового экрана
  overlayTitle.textContent = 'Не пусти Санька в чат';
  overlayTitle.id = '';
  overlayText.textContent = 'Лысый голубоглазый Санёк пытается пробраться в чат «Лучше чем Lebro 2.0». Кликай по нему, чтобы отбить. Не дай ему дойти до окна чата! У тебя 3 жизни.';
  overlayBtn.textContent = 'Играть';
  overlay.classList.add('show');

})();
</script>
</body>
</html>
